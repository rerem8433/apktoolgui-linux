name: Build .deb

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deb:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Dépendances de build
        run: sudo apt-get update && sudo apt-get install -y python3-pil dpkg-dev
      - name: Construire le .deb
        run: |
          chmod +x packaging/build-deb.sh
          DEB=$(packaging/build-deb.sh dist)
          echo "DEB=$DEB" >> "$GITHUB_ENV"
          dpkg-deb -I "$DEB"
      - uses: actions/upload-artifact@v6
        with:
          name: deb
          path: dist/*.deb
      - name: Attacher à la release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          NOTES="packaging/RELEASE_NOTES_${TAG}.md"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$DEB" --clobber
          else
            gh release create "$TAG" "$DEB" --title "APK Tool GUI Linux ${TAG#v}" \
              $( [ -f "$NOTES" ] && echo --notes-file "$NOTES" || echo --generate-notes )
          fi
